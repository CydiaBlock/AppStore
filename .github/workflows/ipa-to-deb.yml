name: IPA to DEB repository

on:
  workflow_dispatch:
    inputs:
      ipa_urls:
        description: "Direct IPA URLs, one per line"
        required: true
        type: string
      release_tag:
        description: "Release category"
        required: true
        default: "application"
        type: choice
        options:
          - game
          - application

concurrency:
  group: package-index
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IPA_URLS: ${{ inputs.ipa_urls }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      REPOSITORY: ${{ github.repository }}
      SERVER_URL: ${{ github.server_url }}
      PROXY_URL: https://cydia.cloudpanic.org
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install package tools
        run: sudo apt-get update && sudo apt-get install --yes aria2 dpkg-dev

      - name: Download and convert IPA files
        run: |
          set -euo pipefail
          mkdir -p work/ipa work/deb
          while IFS= read -r url; do
            url="${url#${url%%[![:space:]]*}}"
            url="${url%${url##*[![:space:]]}}"
            [ -z "$url" ] && continue
            case "$url" in
              https://*|http://*) ;;
              *) echo "Invalid URL: $url" >&2; exit 1 ;;
            esac
            name="$(basename "${url%%\?*}")"
            [[ "$name" == *.ipa ]] || { echo "URL is not an IPA: $url" >&2; exit 1; }
            aria2c -s16 -x16 --allow-overwrite=true \
              --dir=work/ipa --out="$name" "$url"
          done <<< "$IPA_URLS"

          ./ipa2deb work/ipa work/deb \
            "dopaemon <polarisdp@gmail.com>" \
            "$SERVER_URL/$REPOSITORY"
          compgen -G 'work/deb/*.deb' > /dev/null || {
            echo "No DEB was generated" >&2
            exit 1
          }

      - name: Filter out duplicate packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Lấy danh sách file đã upload ở Release hiện tại (nếu release đã tồn tại)
          existing_assets=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' 2>/dev/null || echo "")
          [ -f Packages ] || touch Packages

          echo "🔍 Đang kiểm tra trùng lặp..."

          for deb in work/deb/*.deb; do
            [ -e "$deb" ] || continue
            
            deb_filename=$(basename "$deb")
            pkg_id=$(dpkg-deb -f "$deb" Package || echo "")
            pkg_ver=$(dpkg-deb -f "$deb" Version || echo "")

            # 1. Kiểm tra tên file trùng trên GitHub Release
            if echo "$existing_assets" | grep -qx "$deb_filename"; then
              echo "⚠️ File '$deb_filename' đã có trên Release '$RELEASE_TAG' -> Bỏ qua!"
              rm -f "$deb"
              continue
            fi

            # 2. Kiểm tra Package ID + Version trong file Packages
            if [ -n "$pkg_id" ] && [ -n "$pkg_ver" ]; then
              is_dup=$(awk -v pkg="$pkg_id" -v ver="$pkg_ver" '
                BEGIN { p=0; v=0; dup=0 }
                /^Package: / { p = ($2 == pkg) }
                /^Version: / { v = ($2 == ver) }
                p && v { dup=1 }
                /^$/ { p=0; v=0 }
                END { print dup }
              ' Packages)

              if [ "$is_dup" -eq "1" ]; then
                echo "⚠️ App/Game '$pkg_id' (v$pkg_ver) đã có trong danh sách Packages -> Bỏ qua!"
                rm -f "$deb"
                continue
              fi
            fi

            echo "✅ Package hợp lệ: $pkg_id (v$pkg_ver)"
          done

          # Kiểm tra còn file DEB nào mới để xử lý không
          if ! compgen -G 'work/deb/*.deb' > /dev/null; then
            echo "❌ Tất cả các file DEB nhập vào đều bị trùng (App/Game/Version đã tồn tại). Dừng workflow."
            exit 1
          fi

      - name: Create or update Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" \
              --notes "Packages generated by the IPA to DEB workflow."
          gh release upload "$RELEASE_TAG" work/deb/*.deb --clobber

      - name: Rebuild Packages metadata
        run: scripts/update-packages.sh

      - name: Update README package list
        run: scripts/update-readme.sh

      - name: Commit Packages metadata
        run: |
          set -euo pipefail
          git config user.name dopaemon
          git config user.email polarisdp@gmail.com
          git add Packages Packages.gz README.md
          if git diff --cached --quiet; then
            echo "Packages metadata unchanged"
            exit 0
          fi
          git commit -s -m "Update package index for $RELEASE_TAG"
          git pull --rebase origin main
          git push origin HEAD:main
